<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Polygraph Simulator</title>

<style>

body{
background:black;
font-family:monospace;
}

#container{
display:flex;
}

#waveArea{
width:900px;
}

canvas{
background:black;
border-bottom:1px solid #003300;
}

#panel{
padding-left:20px;
}

.hr{
font-size:90px;
color:#00ff66;
font-weight:bold;
}

.nibp{
color:white;
font-size:28px;
}

.art{
color:red;
font-size:28px;
}

.spo2{
color:yellow;
font-size:28px;
}

input{
width:60px;
background:black;
color:#00ff66;
border:1px solid #00ff66;
margin:2px;
}

button{
background:#002200;
color:#00ff66;
border:1px solid #00ff66;
margin-top:6px;
margin-right:4px;
}

</style>
</head>

<body>

<div id="container">

<div id="waveArea">

<canvas id="ecg" width="900" height="250"></canvas>
<canvas id="art" width="900" height="200"></canvas>

</div>

<div id="panel">

<div class="hr" id="hrDisplay">80</div>
HR

<div class="nibp">
NIBP<br>
<span id="nSys">120</span>/<span id="nDia">70</span>
</div>

<div class="art">
A圧<br>
<span id="aSys">120</span>/<span id="aDia">70</span>
</div>

<div class="spo2">
SpO₂<br>
<span id="spo2">98</span>
</div>

<hr>

HR <input id="hrIn" value="80"><br>

NIBP
<input id="nSysIn" value="120"> /
<input id="nDiaIn" value="70"><br>

A圧
<input id="aSysIn" value="120"> /
<input id="aDiaIn" value="70"><br>

SpO₂
<input id="spo2In" value="98"><br>

<button onclick="apply()">反映</button>

<hr>

紙送り速度<br>

<button onclick="setSpeed(0.8)">25 mm/s</button>
<button onclick="setSpeed(1.6)">50 mm/s</button>
<button onclick="setSpeed(3.2)">100 mm/s</button>

<hr>

<button onclick="start()">START</button>

</div>

</div>

<script>

let HR=80
let nSys=120
let nDia=70
let aSys=120
let aDia=70
let SPO2=98

let speed=1.6

let x=0
let running=false

const ecg=document.getElementById("ecg").getContext("2d")
const art=document.getElementById("art").getContext("2d")

let audioCtx

function beep(){

let osc=audioCtx.createOscillator()
let gain=audioCtx.createGain()

osc.frequency.value=1000
osc.type="square"

gain.gain.value=0.05

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
setTimeout(()=>osc.stop(),40)

}

function drawECG(){

ecg.fillStyle="black"
ecg.fillRect(0,0,900,250)

ecg.strokeStyle="#00ff00"
ecg.beginPath()

for(let i=0;i<900;i++){

let t=(i+x)/40

let y=120

if(Math.sin(t*HR/60*6)>0.98){

y=60
beep()

}

y+=Math.sin(t*2)*3

ecg.lineTo(i,y)

}

ecg.stroke()

}

function drawART(){

art.fillStyle="black"
art.fillRect(0,0,900,200)

art.strokeStyle="red"
art.beginPath()

for(let i=0;i<900;i++){

let t=(i+x)/40

let pressure=
aDia+
(Math.sin(t*HR/60*6)+1)/2*(aSys-aDia)

let y=180-pressure

art.lineTo(i,y)

}

art.stroke()

}

function loop(){

if(!running)return

drawECG()
drawART()

x+=speed

requestAnimationFrame(loop)

}

function start(){

audioCtx=new(window.AudioContext||window.webkitAudioContext)()

running=true
loop()

}

function apply(){

HR=parseFloat(hrIn.value)

nSys=parseFloat(nSysIn.value)
nDia=parseFloat(nDiaIn.value)

aSys=parseFloat(aSysIn.value)
aDia=parseFloat(aDiaIn.value)

SPO2=parseFloat(spo2In.value)

hrDisplay.innerText=HR

nSys.innerText=nSys
nDia.innerText=nDia

aSys.innerText=aSys
aDia.innerText=aDia

spo2.innerText=SPO2

}

function setSpeed(v){

speed=v

}

</script>

</body>
</html>
