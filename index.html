```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カテ室AIモニター</title>

<style>

body{
background:black;
color:#00ff66;
font-family:monospace;
display:flex;
}

#wave{
flex:3;
}

#panel{
flex:1;
padding:20px;
}

canvas{
background:#001000;
border:2px solid #006600;
margin:5px;
}

.big{
font-size:28px;
margin:15px;
}

.alarm{
color:red;
font-weight:bold;
}

button{
font-size:16px;
margin:5px;
}

</style>
</head>

<body>

<div id="wave">

<canvas id="ecg" width="800" height="120"></canvas>
<canvas id="art" width="800" height="120"></canvas>
<canvas id="resp" width="800" height="120"></canvas>
<canvas id="spo2wave" width="800" height="120"></canvas>

</div>

<div id="panel">

<div class="big">HR<br><span id="hrv">80</span></div>

<div class="big">AP<br><span id="bpv">120/70</span></div>

<div class="big">SpO2<br><span id="spv">98</span></div>

<div class="big">ECMO Flow<br><span id="ef">4500</span></div>

<div class="big">Vent Flow<br><span id="vf">3.5</span></div>

<div id="alarm"></div>

<br>

<button onclick="start()">開始</button>
<button onclick="toggleVent()">呼吸器</button>
<button onclick="toggleECMO()">ECMO</button>

</div>

<script>

let HR=80
let SYS=120
let DIA=70
let SPO2=98

let ecmoFlow=4500
let ventFlow=3.5

let ventOn=false
let ecmoOn=false

let x=0

let audioCtx

function beep(freq,dur){

if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)()

let osc=audioCtx.createOscillator()

osc.frequency.value=freq
osc.connect(audioCtx.destination)

osc.start()

osc.stop(audioCtx.currentTime+dur)

}

function monitorSound(){

beep(900,0.05)

setTimeout(monitorSound,60000/HR)

}

function updatePanel(){

hrv.innerText=Math.round(HR)

bpv.innerText=Math.round(SYS)+"/"+Math.round(DIA)

spv.innerText=Math.round(SPO2)

ef.innerText=Math.round(ecmoFlow)

vf.innerText=ventFlow.toFixed(1)

}

function worsen(){

HR+=Math.random()*2

SYS-=Math.random()*2

SPO2-=Math.random()*0.4

ecmoFlow-=Math.random()*40

ventFlow-=Math.random()*0.05

alarm.innerHTML=""

if(SPO2<90){

alarm.innerHTML+="<div class='alarm'>SpO2 LOW</div>"

beep(600,0.2)

}

if(ventFlow<2){

alarm.innerHTML+="<div class='alarm'>VENT FLOW LOW</div>"

beep(700,0.2)

}

if(ecmoFlow<3500){

alarm.innerHTML+="<div class='alarm'>ECMO FLOW LOW</div>"

beep(500,0.2)

}

updatePanel()

}

function toggleVent(){

ventOn=!ventOn

}

function toggleECMO(){

ecmoOn=!ecmoOn

}

function start(){

monitorSound()

setInterval(worsen,3000)

animate()

}

let ecg=document.getElementById("ecg").getContext("2d")
let art=document.getElementById("art").getContext("2d")
let resp=document.getElementById("resp").getContext("2d")
let spo=document.getElementById("spo2wave").getContext("2d")

function ecgWave(t){

let p=Math.exp(-Math.pow((t-0.2)/0.03,2))*3
let q=-Math.exp(-Math.pow((t-0.4)/0.01,2))*6
let r=Math.exp(-Math.pow((t-0.42)/0.008,2))*25
let s=-Math.exp(-Math.pow((t-0.44)/0.01,2))*8
let tw=Math.exp(-Math.pow((t-0.7)/0.05,2))*6

return p+q+r+s+tw

}

function drawECG(){

ecg.fillStyle="#001000"

ecg.fillRect(0,0,800,120)

ecg.strokeStyle="#00ff66"

ecg.beginPath()

let beat=60000/HR

for(let i=0;i<800;i++){

let t=((i+x)%beat)/beat

let y=60-ecgWave(t)*2

ecg.lineTo(i,y)

}

ecg.stroke()

}

function drawART(){

art.fillStyle="#001000"

art.fillRect(0,0,800,120)

art.strokeStyle="red"

art.beginPath()

for(let i=0;i<800;i++){

let y=70+Math.sin((i+x)/20)*30*(SYS/120)

art.lineTo(i,y)

}

art.stroke()

}

function drawRESP(){

resp.fillStyle="#001000"

resp.fillRect(0,0,800,120)

resp.strokeStyle="yellow"

resp.beginPath()

for(let i=0;i<800;i++){

let y=60+Math.sin((i+x)/40)*20

resp.lineTo(i,y)

}

resp.stroke()

}

function drawSPO(){

spo.fillStyle="#001000"

spo.fillRect(0,0,800,120)

spo.strokeStyle="cyan"

spo.beginPath()

for(let i=0;i<800;i++){

let y=80+Math.sin((i+x)/18)*20

spo.lineTo(i,y)

}

spo.stroke()

}

function animate(){

x+=2

drawECG()
drawART()
drawRESP()
drawSPO()

requestAnimationFrame(animate)

}

updatePanel()

</script>

</body>
</html>
```
