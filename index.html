```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カテ室 AIシミュレーター</title>

<style>
body{
background:black;
color:#00ff66;
font-family:monospace;
text-align:center;
}

canvas{
background:#001000;
border:2px solid #008844;
margin:5px;
}

.monitor{
font-size:24px;
margin:10px;
}

input{
width:60px;
font-size:16px;
}

button{
font-size:16px;
margin:4px;
padding:6px 12px;
}

.alarm{
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<h2>カテ室 AIシミュレーター</h2>

<div class="monitor" id="numbers"></div>

<canvas id="ecg" width="700" height="120"></canvas>
<canvas id="art" width="700" height="120"></canvas>
<canvas id="resp" width="700" height="120"></canvas>
<canvas id="spo2" width="700" height="120"></canvas>

<br>

HR<input id="hr" type="number" value="80">
SYS<input id="sys" type="number" value="120">
DIA<input id="dia" type="number" value="70">
SpO2<input id="spo" type="number" value="98">

<button onclick="apply()">反映</button>

<br><br>

<button onclick="start()">開始</button>

<button onclick="toggleVent()">呼吸器</button>
<button onclick="toggleECMO()">ECMO</button>

<br>

<div id="alarm"></div>

<script>

let HR=80
let SYS=120
let DIA=70
let SPO2=98

let ventOn=false
let ecmoOn=false

let ventFlow=3.5
let ecmoFlow=4500

let x=0

let audioCtx

function beep(freq,dur){

if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)()

let osc=audioCtx.createOscillator()

osc.type="square"
osc.frequency.setValueAtTime(freq,audioCtx.currentTime)

osc.connect(audioCtx.destination)

osc.start()

osc.stop(audioCtx.currentTime+dur)

}

function monitorSound(){

beep(900,0.05)

setTimeout(monitorSound,60000/HR)

}

function apply(){

HR=parseInt(hr.value)
SYS=parseInt(sys.value)
DIA=parseInt(dia.value)
SPO2=parseInt(spo.value)

}

function updateNumbers(){

numbers.innerHTML=
"HR "+HR+
" | BP "+SYS+"/"+DIA+
" | SpO2 "+SPO2+
" | VentFlow "+ventFlow.toFixed(1)+"L"+
" | ECMO "+ecmoFlow+"ml"

}

function worsen(){

HR+=Math.random()*2

SYS-=Math.random()*3

SPO2-=Math.random()*0.5

ventFlow-=Math.random()*0.1

ecmoFlow-=Math.random()*50

if(SPO2<90){

alarm.innerHTML="<span class='alarm'>SpO2 LOW</span>"

beep(600,0.2)

}

if(ventFlow<2){

alarm.innerHTML+="<br><span class='alarm'>VENT FLOW LOW</span>"

beep(700,0.2)

}

if(ecmoFlow<3500){

alarm.innerHTML+="<br><span class='alarm'>ECMO FLOW LOW</span>"

beep(500,0.3)

}

updateNumbers()

}

function toggleVent(){

ventOn=!ventOn

}

function toggleECMO(){

ecmoOn=!ecmoOn

}

function start(){

monitorSound()

setInterval(worsen,3000)

animate()

}

let ecg=document.getElementById("ecg").getContext("2d")
let art=document.getElementById("art").getContext("2d")
let resp=document.getElementById("resp").getContext("2d")
let spo=document.getElementById("spo2").getContext("2d")

function drawECG(){

ecg.fillStyle="#001000"

ecg.fillRect(0,0,700,120)

ecg.strokeStyle="#00ff66"

ecg.beginPath()

for(let i=0;i<700;i++){

let y=60+Math.sin((i+x)/15)*20

ecg.lineTo(i,y)

}

ecg.stroke()

}

function drawART(){

art.fillStyle="#001000"

art.fillRect(0,0,700,120)

art.strokeStyle="red"

art.beginPath()

for(let i=0;i<700;i++){

let y=80+Math.sin((i+x)/20)*30*(SYS/120)

art.lineTo(i,y)

}

art.stroke()

}

function drawRESP(){

resp.fillStyle="#001000"

resp.fillRect(0,0,700,120)

resp.strokeStyle="yellow"

resp.beginPath()

for(let i=0;i<700;i++){

let y=60+Math.sin((i+x)/40)*20

resp.lineTo(i,y)

}

resp.stroke()

}

function drawSPO(){

spo.fillStyle="#001000"

spo.fillRect(0,0,700,120)

spo.strokeStyle="cyan"

spo.beginPath()

for(let i=0;i<700;i++){

let y=80+Math.sin((i+x)/18)*20

spo.lineTo(i,y)

}

spo.stroke()

}

function animate(){

x+=2

drawECG()
drawART()
drawRESP()
drawSPO()

requestAnimationFrame(animate)

}

updateNumbers()

</script>

</body>
</html>
```
