<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カテ室ポリグラフシミュレーター</title>
<style>
body{background:black;color:white;font-family:monospace;margin:0;padding:0;}
#container{display:flex;padding:10px;}
#left{width:900px;}
canvas{background:black;display:block;border:1px solid #003300;margin-bottom:4px;}
#right{width:200px;margin-left:20px;}
#hr{font-size:80px;color:#00ff66;font-weight:bold;}
#nibp{font-size:35px;color:white;}
#aPress{font-size:35px;color:red;}
#spo2{font-size:35px;color:yellow;}
input{width:60px;margin:2px;}
button{margin:3px;background:#002200;color:#00ff66;border:1px solid #00ff66;padding:4px;}
</style>
</head>
<body>

<h2 style="text-align:center;color:white;">カテ室ポリグラフシミュレーター</h2>

<div id="container">

<div id="left">
<canvas id="ecg" width="900" height="220"></canvas>
<canvas id="ap" width="900" height="180"></canvas>
</div>

<div id="right">
<div id="hr">HR 70</div>
<div id="nibp">NIBP 120/70</div>
<div id="aPress">A 120/70</div>
<div id="spo2">SpO₂ 98</div>

<hr>

HR<input id="hr_in" value="70"><br>
NIBP SYS<input id="sys_in" value="120"> DIA<input id="dia_in" value="70"><br>
A SYS<input id="asys_in" value="120"> DIA<input id="adia_in" value="70"><br>
SpO₂<input id="spo2_in" value="98"><br>
<button onclick="applyVitals()">反映</button>

<hr>
紙送り速度:
<button onclick="speed=1">遅い</button>
<button onclick="speed=2">普通</button>
<button onclick="speed=4">速い</button>

<hr>
<button id="startBtn">START</button>
</div>

</div>

<script>
let ecgCanvas=document.getElementById("ecg");
let ecg=ecgCanvas.getContext("2d");
let apCanvas=document.getElementById("ap");
let ap=apCanvas.getContext("2d");

let HR=70, NIBP_SYS=120, NIBP_DIA=70, AP_SYS=120, AP_DIA=70, SPO2=98;
let x=0, speed=2;
let audioCtx=null;
let nextBeatTime=0;

function startAudio(){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}

function beep(){
    if(!audioCtx) return;
    let osc=audioCtx.createOscillator();
    let gain=audioCtx.createGain();
    osc.type="square";
    osc.frequency.value=900;
    gain.gain.value=0.1; // 音量
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2); // 0.2秒音を鳴らす
}

function drawECG(){
    ecg.fillStyle="black";
    ecg.fillRect(0,0,900,220);
    ecg.strokeStyle="#00ff66";
    ecg.lineWidth=2;
    ecg.beginPath();
    for(let i=0;i<900;i++){
        let t=(i+x)/120;
        let phase=(t*HR/60)%1;
        let y=120;
        if(phase<0.02) y=70;          // R波
        else if(phase<0.04) y=150;     // S波
        else if(phase<0.06) y=110;     // T波
        else y=120+Math.sin(t*5)*3;    // baseline
        ecg.lineTo(i,y);
    }
    ecg.stroke();
}

function drawAP(){
    ap.fillStyle="black";
    ap.fillRect(0,0,900,180);
    ap.strokeStyle="red";
    ap.lineWidth=2;
    ap.beginPath();
    for(let i=0;i<900;i++){
        let t=(i+x)/120;
        let phase=(t*HR/60)%1;
        let pressure=AP_DIA+(AP_SYS-AP_DIA)*(Math.sin(phase*Math.PI));
        let y=160-pressure*0.5;
        ap.lineTo(i,y);
    }
    ap.stroke();
}

function loop(){
    x+=speed;
    drawECG();
    drawAP();
    if(audioCtx){
        let now=audioCtx.currentTime*1000;
        let interval=60000/HR;
        if(now>=nextBeatTime){
            beep();
            nextBeatTime=now+interval;
        }
    }
    requestAnimationFrame(loop);
}

function applyVitals(){
    HR=parseInt(document.getElementById("hr_in").value);
    NIBP_SYS=parseInt(document.getElementById("sys_in").value);
    NIBP_DIA=parseInt(document.getElementById("dia_in").value);
    AP_SYS=parseInt(document.getElementById("asys_in").value);
    AP_DIA=parseInt(document.getElementById("adia_in").value);
    SPO2=parseInt(document.getElementById("spo2_in").value);
    document.getElementById("hr").innerText="HR "+HR;
    document.getElementById("nibp").innerText="NIBP "+NIBP_SYS+"/"+NIBP_DIA;
    document.getElementById("aPress").innerText="A "+AP_SYS+"/"+AP_DIA;
    document.getElementById("spo2").innerText="SpO₂ "+SPO2;
    if(audioCtx) nextBeatTime=audioCtx.currentTime*1000;
}

document.getElementById("startBtn").addEventListener("click", ()=>{
    if(!audioCtx) startAudio();
    nextBeatTime=audioCtx.currentTime*1000;
    loop();
});
</script>

</body>
</html>
