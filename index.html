```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Polygraph Simulator</title>

<style>
body{
background:black;
color:#00ff66;
font-family:monospace;
}

#container{
display:flex;
}

#waves{
width:900px;
}

canvas{
background:black;
border-bottom:1px solid #003300;
}

#panel{
padding-left:20px;
}

.hr{
font-size:80px;
font-weight:bold;
}

.value{
font-size:30px;
margin-top:20px;
}

input{
width:60px;
background:black;
color:#00ff66;
border:1px solid #00ff66;
}
</style>
</head>

<body>

<div id="container">

<div id="waves">

<canvas id="ecg" width="900" height="250"></canvas>
<canvas id="art" width="900" height="200"></canvas>

</div>

<div id="panel">

<div class="hr">
<span id="hrv">80</span>
</div>
HR

<div class="value">
NIBP<br>
<span id="sysv">120</span>/<span id="diav">70</span>
</div>

<div class="value">
SpO₂<br>
<span id="spo2v">98</span>
</div>

<br>

HR<input id="hr" value="80"><br>
SYS<input id="sys" value="120"><br>
DIA<input id="dia" value="70"><br>
SPO2<input id="spo2" value="98"><br>

<button onclick="apply()">反映</button>
<button onclick="start()">START</button>

</div>

</div>

<script>

let HR=80
let SYS=120
let DIA=70
let SPO2=98

let x=0
let running=false

const ecg=document.getElementById("ecg")
const ecgctx=ecg.getContext("2d")

const art=document.getElementById("art")
const artctx=art.getContext("2d")

let audioCtx

function beep(){

if(!audioCtx){
audioCtx=new(window.AudioContext||window.webkitAudioContext)()
}

let osc=audioCtx.createOscillator()
let gain=audioCtx.createGain()

osc.frequency.value=900
gain.gain.value=0.05

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
setTimeout(()=>osc.stop(),40)

}

function drawECG(){

ecgctx.fillStyle="black"
ecgctx.fillRect(0,0,900,250)

ecgctx.strokeStyle="#00ff00"
ecgctx.beginPath()

for(let i=0;i<900;i++){

let t=(i+x)/40
let y=120

if(Math.sin(t*HR/60*6)>0.95){
y=60
beep()
}

y+=Math.sin(t*2)*5

ecgctx.lineTo(i,y)

}

ecgctx.stroke()

}

function drawART(){

artctx.fillStyle="black"
artctx.fillRect(0,0,900,200)

artctx.strokeStyle="#ff4444"
artctx.beginPath()

for(let i=0;i<900;i++){

let t=(i+x)/40

let pressure=
DIA+
(Math.sin(t*HR/60*6)+1)/2*(SYS-DIA)

let y=180-pressure

artctx.lineTo(i,y)

}

artctx.stroke()

}

function loop(){

if(!running)return

drawECG()
drawART()

x+=2

requestAnimationFrame(loop)

}

function start(){

running=true
loop()

}

function apply(){

HR=parseFloat(document.getElementById("hr").value)
SYS=parseFloat(document.getElementById("sys").value)
DIA=parseFloat(document.getElementById("dia").value)
SPO2=parseFloat(document.getElementById("spo2").value)

document.getElementById("hrv").innerText=HR
document.getElementById("sysv").innerText=SYS
document.getElementById("diav").innerText=DIA
document.getElementById("spo2v").innerText=SPO2

}

</script>

</body>
</html>
