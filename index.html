<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カテ室ポリグラフシミュレーター</title>

<style>

body{
background:black;
color:#00ff66;
font-family:monospace;
text-align:center;
}

h1{
color:white;
}

.monitor{
font-size:26px;
margin:10px;
}

canvas{
background:#001100;
border:1px solid #00ff66;
margin:6px;
}

button{
font-size:16px;
padding:10px 20px;
margin:6px;
}

#scenario{
color:yellow;
}

#log{
color:white;
margin-top:10px;
}

</style>
</head>

<body>

<h1>カテ室ポリグラフシミュレーター</h1>

<div id="scenario"></div>

<div class="monitor" id="numbers"></div>

<canvas id="ecg" width="700" height="120"></canvas>
<canvas id="art" width="700" height="120"></canvas>
<canvas id="resp" width="700" height="120"></canvas>

<br>

<button onclick="action('atropine')">アトロピン</button>
<button onclick="action('nitro')">ニトロ</button>
<button onclick="action('echo')">エコー</button>
<button onclick="action('defib')">除細動</button>
<button onclick="action('report')">医師報告</button>

<br>

<button onclick="toggleVent()">呼吸器</button>
<button onclick="toggleECMO()">ECMO</button>

<br><br>

<button onclick="restart()">新しい症例</button>

<p id="log"></p>

<script>

let HR
let SYS
let DIA
let SPO2

let scenario
let solved=false
let startTime

let x=0

let ecgCanvas=document.getElementById("ecg")
let ecgCtx=ecgCanvas.getContext("2d")

let artCanvas=document.getElementById("art")
let artCtx=artCanvas.getContext("2d")

let respCanvas=document.getElementById("resp")
let respCtx=respCanvas.getContext("2d")

let beep=new Audio("beep.mp3")
let vent=new Audio("vent.mp3")
let ecmo=new Audio("ecmo.mp3")

vent.loop=true
ecmo.loop=true

let ventOn=false
let ecmoOn=false

let scenarios=[

{
name:"迷走神経反射",
init:function(){
HR=80
SYS=120
DIA=70
SPO2=98
},
correct:"atropine",
worsen:function(){
HR-=6
SYS-=8
}
},

{
name:"slow flow",
init:function(){
HR=85
SYS=110
DIA=65
SPO2=97
},
correct:"nitro",
worsen:function(){
SYS-=6
SPO2-=1
}
},

{
name:"心タンポナーデ",
init:function(){
HR=95
SYS=105
DIA=70
SPO2=96
},
correct:"echo",
worsen:function(){
HR+=4
SYS-=10
}
},

{
name:"心室細動",
init:function(){
HR=160
SYS=70
DIA=40
SPO2=85
},
correct:"defib",
worsen:function(){
SYS-=6
SPO2-=3
}
}

]

function startScenario(){

scenario=scenarios[Math.floor(Math.random()*scenarios.length)]

scenario.init()

document.getElementById("scenario").innerText="イベント: "+scenario.name

startTime=Date.now()

solved=false

updateNumbers()

}

function updateNumbers(){

document.getElementById("numbers").innerHTML=

"HR <span style='color:#00ff66'>"+HR+"</span> bpm | "+

"A圧 <span style='color:red'>"+SYS+"/"+DIA+"</span> | "+

"SpO2 <span style='color:yellow'>"+SPO2+"</span>"

}

function worsen(){

if(solved) return

scenario.worsen()

if(SYS<50 || SPO2<70){

document.getElementById("log").innerText="ショック状態"

solved=true

}

updateNumbers()

}

function action(a){

if(solved) return

if(a==scenario.correct){

let time=((Date.now()-startTime)/1000).toFixed(1)

document.getElementById("log").innerText="対応成功 判断時間 "+time+" 秒"

solved=true

}else{

document.getElementById("log").innerText="効果なし"

}

}

function restart(){

document.getElementById("log").innerText=""

startScenario()

}

function monitorBeep(){

if(solved) return

beep.currentTime=0
beep.play()

let interval=60000/HR

setTimeout(monitorBeep,interval)

}

function toggleVent(){

if(!ventOn){

vent.play()
ventOn=true

}else{

vent.pause()
ventOn=false

}

}

function toggleECMO(){

if(!ecmoOn){

ecmo.play()
ecmoOn=true

}else{

ecmo.pause()
ecmoOn=false

}

}

function drawGrid(ctx){

ctx.strokeStyle="#003300"
ctx.lineWidth=0.5

for(let i=0;i<700;i+=25){

ctx.beginPath()
ctx.moveTo(i,0)
ctx.lineTo(i,120)
ctx.stroke()

}

for(let j=0;j<120;j+=20){

ctx.beginPath()
ctx.moveTo(0,j)
ctx.lineTo(700,j)
ctx.stroke()

}

}

function drawECG(){

ecgCtx.fillStyle="#001100"
ecgCtx.fillRect(0,0,700,120)

drawGrid(ecgCtx)

ecgCtx.strokeStyle="#00ff66"
ecgCtx.lineWidth=2
ecgCtx.beginPath()

for(let i=0;i<700;i++){

let y=60+Math.sin((i+x)/10)*10

if(i%90<3) y=20

if(scenario.name=="心室細動"){

y=60+Math.random()*40-20

}

ecgCtx.lineTo(i,y)

}

ecgCtx.stroke()

}

function drawART(){

artCtx.fillStyle="#001100"
artCtx.fillRect(0,0,700,120)

drawGrid(artCtx)

artCtx.strokeStyle="red"
artCtx.lineWidth=2
artCtx.beginPath()

for(let i=0;i<700;i++){

let amp=(SYS/120)*25
let y=70-Math.sin((i+x)/15)*amp

artCtx.lineTo(i,y)

}

artCtx.stroke()

}

function drawRESP(){

respCtx.fillStyle="#001100"
respCtx.fillRect(0,0,700,120)

drawGrid(respCtx)

respCtx.strokeStyle="yellow"
respCtx.lineWidth=2
respCtx.beginPath()

for(let i=0;i<700;i++){

let y=60+Math.sin((i+x)/40)*20

respCtx.lineTo(i,y)

}

respCtx.stroke()

}

function animate(){

x+=4

drawECG()
drawART()
drawRESP()

requestAnimationFrame(animate)

}

startScenario()

setInterval(worsen,4000)

monitorBeep()

animate()

</script>

</body>
</html>
