```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Polygraph Monitor</title>

<style>

body{
background:black;
font-family:monospace;
}

#container{
display:flex;
}

#waves{
width:950px;
}

canvas{
background:black;
border-bottom:1px solid #003300;
}

#panel{
padding-left:20px;
}

.hr{
font-size:90px;
color:#00ff66;
font-weight:bold;
}

.nibp{
color:white;
font-size:28px;
}

.art{
color:red;
font-size:28px;
}

.spo2{
color:yellow;
font-size:28px;
}

input{
width:60px;
background:black;
color:#00ff66;
border:1px solid #00ff66;
margin:2px;
}

button{
background:#002200;
color:#00ff66;
border:1px solid #00ff66;
margin:4px;
}

</style>
</head>

<body>

<div id="container">

<div id="waves">

<canvas id="lead1" width="950" height="80"></canvas>
<canvas id="lead2" width="950" height="80"></canvas>
<canvas id="lead3" width="950" height="80"></canvas>
<canvas id="avr" width="950" height="80"></canvas>
<canvas id="avl" width="950" height="80"></canvas>
<canvas id="avf" width="950" height="80"></canvas>

<canvas id="art" width="950" height="200"></canvas>

</div>

<div id="panel">

<div class="hr" id="hrDisplay">80</div>
HR

<div class="nibp">
NIBP<br>
<span id="nSys">120</span>/<span id="nDia">70</span>
</div>

<div class="art">
A圧<br>
<span id="aSys">120</span>/<span id="aDia">70</span>
</div>

<div class="spo2">
SpO₂<br>
<span id="spo2">98</span>
</div>

<hr>

HR <input id="hrIn" value="80"><br>

NIBP
<input id="nSysIn" value="120"> /
<input id="nDiaIn" value="70"><br>

A圧
<input id="aSysIn" value="120"> /
<input id="aDiaIn" value="70"><br>

SpO₂
<input id="spo2In" value="98"><br>

<button onclick="apply()">反映</button>

<hr>

紙送り速度<br>

<button onclick="speed=0.4">遅い</button>
<button onclick="speed=0.8">25mm/s</button>
<button onclick="speed=1.6">50mm/s</button>

<hr>

<button onclick="start()">START</button>

</div>

</div>

<script>

let HR=80
let nSys=120
let nDia=70
let aSys=120
let aDia=70
let SPO2=98

let x=0
let speed=0.4
let running=false

let beat=false

const leads=[
document.getElementById("lead1").getContext("2d"),
document.getElementById("lead2").getContext("2d"),
document.getElementById("lead3").getContext("2d"),
document.getElementById("avr").getContext("2d"),
document.getElementById("avl").getContext("2d"),
document.getElementById("avf").getContext("2d")
]

const art=document.getElementById("art").getContext("2d")

let audioCtx

function beep(){

let osc=audioCtx.createOscillator()
let gain=audioCtx.createGain()

osc.frequency.value=1000
osc.type="square"

gain.gain.value=0.05

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
osc.stop(audioCtx.currentTime+0.05)

}

function ecgShape(t){

let base=Math.sin(t*HR/60*6)

let y=0

if(base>0.98){

y=-40

if(!beat){
beep()
beat=true
}

}else{
beat=false
}

y+=Math.sin(t*2)*5

return y

}

function drawECG(){

for(let l=0;l<leads.length;l++){

let ctx=leads[l]

ctx.fillStyle="black"
ctx.fillRect(0,0,950,80)

ctx.strokeStyle="#00ff00"
ctx.beginPath()

for(let i=0;i<950;i++){

let t=(i+x)/40

let y=40+ecgShape(t)*(1+(l*0.15))

ctx.lineTo(i,y)

}

ctx.stroke()

}

}

function drawART(){

art.fillStyle="black"
art.fillRect(0,0,950,200)

art.strokeStyle="red"
art.beginPath()

for(let i=0;i<950;i++){

let t=(i+x)/40

let pressure=
aDia+
(Math.sin(t*HR/60*6)+1)/2*(aSys-aDia)

let y=180-pressure

art.lineTo(i,y)

}

art.stroke()

}

function loop(){

if(!running)return

drawECG()
drawART()

x+=speed

requestAnimationFrame(loop)

}

function start(){

audioCtx=new(window.AudioContext||window.webkitAudioContext)()

audioCtx.resume()

running=true
loop()

}

function apply(){

HR=parseFloat(hrIn.value)

nSys=parseFloat(nSysIn.value)
nDia=parseFloat(nDiaIn.value)

aSys=parseFloat(aSysIn.value)
aDia=parseFloat(aDiaIn.value)

SPO2=parseFloat(spo2In.value)

hrDisplay.innerText=HR

document.getElementById("nSys").innerText=nSys
document.getElementById("nDia").innerText=nDia

document.getElementById("aSys").innerText=aSys
document.getElementById("aDia").innerText=aDia

document.getElementById("spo2").innerText=SPO2

}

</script>

</body>
</html>
