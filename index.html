<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カテ室トラブルシミュレーター</title>

<style>
body{
background:#000;
color:#00ff66;
font-family:monospace;
text-align:center;
}

h1{
color:white;
}

.monitor{
font-size:26px;
margin:10px;
}

canvas{
background:#001100;
border:1px solid #00ff66;
margin:8px;
}

button{
font-size:16px;
padding:10px 20px;
margin:6px;
}

#log{
margin-top:15px;
color:white;
}

#scenario{
color:yellow;
}
</style>
</head>

<body>

<h1>カテ室トラブルシミュレーター</h1>

<div id="scenario"></div>

<div class="monitor" id="numbers"></div>

<canvas id="ecg" width="700" height="120"></canvas>
<canvas id="art" width="700" height="120"></canvas>

<div>

<button onclick="action('atropine')">アトロピン</button>
<button onclick="action('nitro')">ニトロ</button>
<button onclick="action('echo')">エコー</button>
<button onclick="action('defib')">除細動</button>
<button onclick="action('report')">医師報告</button>

</div>

<br>

<button onclick="restart()">新しい症例</button>

<p id="log"></p>

<script>

let HR
let SYS
let DIA
let SPO2

let scenario
let solved=false

let startTime

let ecgCanvas=document.getElementById("ecg")
let ecgCtx=ecgCanvas.getContext("2d")

let artCanvas=document.getElementById("art")
let artCtx=artCanvas.getContext("2d")

let x=0

let scenarios=[

{
name:"迷走神経反射",
init:function(){
HR=80
SYS=120
DIA=70
SPO2=98
},
correct:"atropine",
worsen:function(){
HR-=6
SYS-=8
DIA-=4
}
},

{
name:"slow flow",
init:function(){
HR=85
SYS=110
DIA=65
SPO2=97
},
correct:"nitro",
worsen:function(){
SYS-=5
SPO2-=2
}
},

{
name:"心タンポナーデ",
init:function(){
HR=95
SYS=105
DIA=70
SPO2=96
},
correct:"echo",
worsen:function(){
HR+=4
SYS-=10
}
},

{
name:"心室細動",
init:function(){
HR=160
SYS=70
DIA=40
SPO2=85
},
correct:"defib",
worsen:function(){
SYS-=5
SPO2-=3
}
}

]

function startScenario(){

scenario=scenarios[Math.floor(Math.random()*scenarios.length)]

scenario.init()

document.getElementById("scenario").innerText="イベント: "+scenario.name

startTime=Date.now()

solved=false

updateNumbers()

}

function updateNumbers(){

document.getElementById("numbers").innerHTML=
"HR "+HR+" bpm | A圧 "+SYS+"/"+DIA+" | SpO2 "+SPO2

}

function worsen(){

if(solved) return

scenario.worsen()

if(SYS<50 || SPO2<70){

document.getElementById("log").innerText="患者状態悪化 → ショック"

solved=true

}

updateNumbers()

}

function action(a){

if(solved) return

if(a==scenario.correct){

let time=((Date.now()-startTime)/1000).toFixed(1)

document.getElementById("log").innerText="対応成功！ 判断時間 "+time+" 秒"

solved=true

}else{

document.getElementById("log").innerText="効果なし"

}

}

function restart(){

document.getElementById("log").innerText=""

startScenario()

}

function drawECG(){

ecgCtx.fillStyle="#001100"
ecgCtx.fillRect(0,0,700,120)

ecgCtx.strokeStyle="#00ff66"
ecgCtx.beginPath()

for(let i=0;i<700;i++){

let y=60+Math.sin((i+x)/10)*10

if(i%90<3) y=20

if(scenario.name=="心室細動"){

y=60+Math.random()*40-20

}

ecgCtx.lineTo(i,y)

}

ecgCtx.stroke()

}

function drawART(){

artCtx.fillStyle="#001100"
artCtx.fillRect(0,0,700,120)

artCtx.strokeStyle="#00ff66"
artCtx.beginPath()

for(let i=0;i<700;i++){

let amp=(SYS/120)*25

let y=70-Math.sin((i+x)/15)*amp

artCtx.lineTo(i,y)

}

artCtx.stroke()

}

function animate(){

x+=4

drawECG()

drawART()

requestAnimationFrame(animate)

}

startScenario()

setInterval(worsen,4000)

animate()

</script>

</body>
</html>
